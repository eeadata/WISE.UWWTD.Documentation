# This is a GitHub Actions workflow file 
# designed to automatically build and deploy Sphinx documentation to GitHub Pages.

# The name of the workflow as it appears in the GitHub Actions UI
name: documentation

# Defines the events that trigger this workflow: 
# Runs on code pushes, pull requests, manual triggers (workflow_dispatch),
# and branch deletions, which remove that branch's published preview
on: [push, pull_request, workflow_dispatch, delete]

# Grants the workflow write permissions to the repository. 
# This is required so it can push the built HTML to the gh-pages branch later.
permissions:
  contents: write

# One deployment to gh-pages at a time, so that two pushes do not race
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  docs:
    # The build itself runs for every event; only the deploy step is gated
    if: ${{ github.event_name != 'delete' }}
    # Runs the job on a fresh Ubuntu Linux virtual machine hosted by GitHub
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Download your repository's code onto the runner so the workflow can use it
      - uses: actions/checkout@v6
      
      # Step 2: Install and set up a Python environment
      - uses: actions/setup-python@v6
      
      # Step 3: Install the required Python packages for building the docs
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt          
          
      # Check the field tables in reference/schema against the types and code lists
      - name: Check field tables
        run: |
          python reference/schema/check.py

      # Step 4: Run Sphinx to build the actual HTML documentation
      # This takes the source files from the 'doc' folder and outputs HTML to '_build'
      - name: Sphinx build
        run: |
          sphinx-build docs _build

      # Step 5: Build the data explorer (explorer/, Observable Framework) and put it in the site
      # under explorer/, next to the documentation. Its data loaders read reference/ and download
      # the spatial points prefill from its GitHub release.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Explorer build
        working-directory: explorer
        run: |
          npm ci
          npm run build
      - name: Assemble the site
        run: |
          cp -r explorer/dist _build/explorer
          rm -rf _build/.doctrees _build/.buildinfo

      # Step 6: Deploy to GitHub Pages. The site is served from the gh-pages branch: main at the
      # root, and every other branch in its own subdirectory under branch/, so work in progress
      # can be reviewed online before it is merged. Pull requests are not deployed: the preview
      # of their source branch already covers them.
      #
      # The deployed folder is replaced, so files that the build no longer makes are removed from
      # the site. The deployment of main leaves branch/ alone, and a preview leaves everything
      # outside its own folder alone.
      - name: Deploy to GitHub Pages
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/gh-pages' }}
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin gh-pages
          git worktree add --detach site FETCH_HEAD
          if [ "$IS_MAIN" = true ]; then
            rsync -a --delete --exclude=/.git --exclude=/branch/ _build/ site/
          else
            # Slashes in a branch name become subdirectories, which is harmless
            mkdir -p "site/branch/$REF_NAME"
            rsync -a --delete _build/ "site/branch/$REF_NAME/"
          fi
          # Serve folders starting with an underscore (_static, _observablehq) as they are
          touch site/.nojekyll
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -q -m "Deploy $REF_NAME ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi

  # Remove a branch's preview once the branch itself is deleted
  cleanup:
    if: ${{ github.event_name == 'delete' && github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
      - name: Remove the preview of the deleted branch
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          if [ -d "branch/$DELETED_BRANCH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r -q "branch/$DELETED_BRANCH"
            git commit -q -m "Remove preview of deleted branch $DELETED_BRANCH"
            git push
          fi
